{% extends "base.html" %}

{% block title %}搜索系统{% endblock %}

{% block content %}
<div class="search-page">
    <div class="search-header">
        <h2>🔍 生态数据搜索</h2>
        <p class="subtitle">搜索物种、栖息地、观测记录</p>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
        <form id="search-form" onsubmit="performSearch(event)">
            <div class="search-input-group">
                <input 
                    type="text" 
                    id="search-input" 
                    name="q" 
                    placeholder="输入关键词搜索（如：东北虎、吉林省、温带森林）"
                    autocomplete="off"
                    required
                >
                <select id="category-select" name="category">
                    <option value="">全部类别</option>
                    <option value="物种">物种</option>
                    <option value="栖息地">栖息地</option>
                    <option value="观测记录">观测记录</option>
                </select>
                <button type="submit" class="btn btn-primary">搜索</button>
            </div>
        </form>
    </div>

    <!-- 热门搜索 -->
    <div class="popular-searches">
        <h4>🔥 热门搜索</h4>
        <div id="popular-tags">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 搜索结果 -->
    <div id="search-results" style="display: none;">
        <div class="results-header">
            <h3 id="results-title">搜索结果</h3>
            <span id="results-count" class="results-count"></span>
        </div>

        <!-- 结果统计 -->
        <div class="results-tabs">
            <button class="tab active" onclick="showTab('all', event)">
                全部 (<span id="count-all">0</span>)
            </button>
            <button class="tab" onclick="showTab('species', event)">
                物种 (<span id="count-species">0</span>)
            </button>
            <button class="tab" onclick="showTab('habitats', event)">
                栖息地 (<span id="count-habitats">0</span>)
            </button>
            <button class="tab" onclick="showTab('observations', event)">
                观测记录 (<span id="count-observations">0</span>)
            </button>
        </div>

        <!-- 物种结果 -->
        <div id="results-species" class="results-section">
            <h4>🦁 物种</h4>
            <div id="species-list" class="result-list"></div>
        </div>

        <!-- 栖息地结果 -->
        <div id="results-habitats" class="results-section">
            <h4>🌍 栖息地</h4>
            <div id="habitats-list" class="result-list"></div>
        </div>

        <!-- 观测记录结果 -->
        <div id="results-observations" class="results-section">
            <h4>📝 观测记录</h4>
            <div id="observations-list" class="result-list"></div>
        </div>

        <!-- 相关推荐 -->
        <div id="recommendations-section" style="display: none;">
            <h3>💡 相关推荐</h3>
            <div id="recommendations-content"></div>
        </div>
    </div>

    <!-- 无结果提示 -->
    <div id="no-results" style="display: none;">
        <div class="no-results">
            <p>😕 未找到相关结果</p>
            <p>建议：</p>
            <ul>
                <li>检查拼写是否正确</li>
                <li>尝试使用更通用的关键词</li>
                <li>使用不同的搜索词组合</li>
            </ul>
        </div>
    </div>
</div>

<script>
let currentTab = 'all';
let searchResults = {};
let currentKeyword = '';

// 页面加载时获取热门搜索
window.onload = function() {
    loadPopularSearches();
};

// 加载热门搜索词
async function loadPopularSearches() {
    try {
        const response = await fetch('/api/search/popular?limit=10');
        const data = await response.json();
        
        if (data.success && data.popular_searches.length > 0) {
            const tagsContainer = document.getElementById('popular-tags');
            tagsContainer.innerHTML = data.popular_searches.map(item => 
                `<span class="tag" onclick="searchByTag('${item.keyword}')">
                    ${item.keyword} (${item.count})
                </span>`
            ).join('');
        } else {
            document.getElementById('popular-tags').innerHTML = 
                '<span class="no-data">暂无热门搜索</span>';
        }
    } catch (error) {
        console.error('加载热门搜索失败:', error);
    }
}

// 点击热门标签搜索
function searchByTag(keyword) {
    document.getElementById('search-input').value = keyword;
    performSearch(new Event('submit'));
}

// 执行搜索
async function performSearch(event) {
    if (event) event.preventDefault();
    
    const keyword = document.getElementById('search-input').value.trim();
    const category = document.getElementById('category-select').value;
    
    if (!keyword) {
        alert('请输入搜索关键词');
        return;
    }
    
    currentKeyword = keyword;
    
    // 显示加载状态
    document.getElementById('search-results').style.display = 'block';
    document.getElementById('no-results').style.display = 'none';
    document.getElementById('results-title').textContent = `"${keyword}" 的搜索结果`;
    
    try {
        // ⭐ 添加调试日志
        console.log('🔍 开始搜索:', keyword, 'category:', category);
        
        const response = await fetch(
            `/api/search?q=${encodeURIComponent(keyword)}&category=${category}`
        );
        
        // ⭐ 检查响应状态
        console.log('📡 响应状态:', response.status, response.statusText);
        
        // ⭐ 检查响应是否成功
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        // ⭐ 打印返回的数据
        console.log('📦 返回数据:', data);
        
        if (data.success) {
            searchResults = data.results;
            displayResults(searchResults);
            
            // 加载推荐
            loadRecommendations(keyword);
            
            // 刷新热门搜索
            loadPopularSearches();
            
            console.log('✅ 搜索成功，共找到', data.total, '条结果');
            
        } else {
            console.warn('⚠️ 搜索返回 success=false:', data.message);
            showNoResults();
        }
        
    } catch (error) {
        // ⭐ 详细的错误信息
        console.error('❌ 搜索失败，详细错误:', error);
        console.error('错误类型:', error.name);
        console.error('错误消息:', error.message);
        console.error('错误堆栈:', error.stack);
        
        alert('搜索失败，请重试\n错误详情：' + error.message);
    }
}


// 显示搜索结果
function displayResults(results) {
    const total = results.total || 0;
    
    if (total === 0) {
        showNoResults();
        return;
    }
    
    // 更新统计
    document.getElementById('results-count').textContent = `找到 ${total} 条结果`;
    document.getElementById('count-all').textContent = total;
    document.getElementById('count-species').textContent = results.species.length;
    document.getElementById('count-habitats').textContent = results.habitats.length;
    document.getElementById('count-observations').textContent = results.observations.length;
    
    // 显示各类结果
    displaySpeciesResults(results.species);
    displayHabitatResults(results.habitats);
    displayObservationResults(results.observations);
    
    // 显示全部结果
    showTab('all');
}

// 显示物种结果
function displaySpeciesResults(species) {
    const container = document.getElementById('species-list');
    
    if (species.length === 0) {
        container.innerHTML = '<p class="no-data">暂无物种结果</p>';
        return;
    }
    
    // 按评分排序
    species.sort((a, b) => (b.result_score || 0) - (a.result_score || 0));
    
    container.innerHTML = species.map(s => `
        <div class="result-card">
            <div class="result-icon">🦁</div>
            <div class="result-content">
                <h4>${highlightKeyword(s.name, currentKeyword)}</h4>
                <p class="result-meta">
                    <span class="badge">${s.category}</span>
                    ${s.protection_level ? `<span class="badge badge-danger">${s.protection_level}</span>` : ''}
                </p>
                ${s.scientific_name ? `<p class="scientific-name">${s.scientific_name}</p>` : ''}
                ${s.habitat ? `<p>🏞️ 栖息地: ${s.habitat}</p>` : ''}
                ${s.description ? `<p class="description">${truncate(s.description, 100)}</p>` : ''}
                <div class="result-actions">
                    <a href="/species/${s._id}" class="btn-small">查看详情</a>
                    <span class="score">相关度: ${s.result_score || 0}</span>
                </div>
            </div>
        </div>
    `).join('');
}

// 显示栖息地结果
function displayHabitatResults(habitats) {
    const container = document.getElementById('habitats-list');
    
    if (habitats.length === 0) {
        container.innerHTML = '<p class="no-data">暂无栖息地结果</p>';
        return;
    }
    
    habitats.sort((a, b) => (b.result_score || 0) - (a.result_score || 0));
    
    container.innerHTML = habitats.map(h => `
        <div class="result-card">
            <div class="result-icon">🌍</div>
            <div class="result-content">
                <h4>${highlightKeyword(h.name, currentKeyword)}</h4>
                <p class="result-meta">
                    <span class="badge">${h.protection_level || '未分级'}</span>
                </p>
                <p>📍 ${h.location?.province || ''} ${h.location?.city || ''}</p>
                ${h.area ? `<p>📏 面积: ${h.area}</p>` : ''}
                ${h.description ? `<p class="description">${truncate(h.description, 100)}</p>` : ''}
                <div class="result-actions">
                    <span class="score">相关度: ${h.result_score || 0}</span>
                </div>
            </div>
        </div>
    `).join('');
}

// 显示观测记录结果
function displayObservationResults(observations) {
    const container = document.getElementById('observations-list');
    
    if (observations.length === 0) {
        container.innerHTML = '<p class="no-data">暂无观测记录结果</p>';
        return;
    }
    
    observations.sort((a, b) => (b.result_score || 0) - (a.result_score || 0));
    
    container.innerHTML = observations.map(o => `
        <div class="result-card">
            <div class="result-icon">📝</div>
            <div class="result-content">
                <h4>${highlightKeyword(o.species_name, currentKeyword)}</h4>
                <p class="result-meta">
                    ${o.verified ? '<span class="badge badge-success">✓ 已验证</span>' : '<span class="badge badge-warning">待验证</span>'}
                </p>
                <p>👤 观测者: ${o.observer?.name} (${o.observer?.type})</p>
                <p>📅 日期: ${o.observation?.date}</p>
                <p>📍 地点: ${o.observation?.location?.province || ''} ${o.observation?.location?.city || ''}</p>
                ${o.observation?.behavior ? `<p>🐾 行为: ${o.observation.behavior}</p>` : ''}
                <div class="result-actions">
                    <span class="score">相关度: ${o.result_score || 0}</span>
                </div>
            </div>
        </div>
    `).join('');
}

// 加载推荐内容
async function loadRecommendations(keyword) {
    try {
        const response = await fetch(
            `/api/search/recommendations?keyword=${encodeURIComponent(keyword)}`
        );
        const data = await response.json();
        
        if (data.success) {
            displayRecommendations(data.recommendations);
        }
    } catch (error) {
        console.error('加载推荐失败:', error);
    }
}

// 显示推荐内容
function displayRecommendations(recommendations) {
    const hasRecommendations = 
        recommendations.related_species.length > 0 || 
        recommendations.related_habitats.length > 0;
    
    if (!hasRecommendations) {
        document.getElementById('recommendations-section').style.display = 'none';
        return;
    }
    
    let html = '';
    
    if (recommendations.related_species.length > 0) {
        html += `
            <div class="recommendation-group">
                <h4>相关物种</h4>
                <div class="recommendation-list">
                    ${recommendations.related_species.map(s => `
                        <div class="recommendation-item">
                            <span class="rec-icon">🦁</span>
                            <span class="rec-name">${s.name}</span>
                            <span class="rec-meta">${s.category}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    if (recommendations.related_habitats.length > 0) {
        html += `
            <div class="recommendation-group">
                <h4>相关栖息地</h4>
                <div class="recommendation-list">
                    ${recommendations.related_habitats.map(h => `
                        <div class="recommendation-item">
                            <span class="rec-icon">🌍</span>
                            <span class="rec-name">${h.name}</span>
                            <span class="rec-meta">${h.location?.province || ''}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    document.getElementById('recommendations-content').innerHTML = html;
    document.getElementById('recommendations-section').style.display = 'block';
}

// 显示无结果
function showNoResults() {
    document.getElementById('search-results').style.display = 'none';
    document.getElementById('no-results').style.display = 'block';
}

// 切换标签页
function showTab(tab, event) {
    currentTab = tab;
    
    // 更新标签激活状态
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    // ⭐ 修复：只有当 event 存在时才操作 target
    if (event && event.target) {
        event.target.classList.add('active');
    } else {
        // 如果没有 event，通过 tab 参数找到对应的按钮并激活
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => {
            if (t.textContent.includes('全部') && tab === 'all') {
                t.classList.add('active');
            } else if (t.textContent.includes('物种') && tab === 'species') {
                t.classList.add('active');
            } else if (t.textContent.includes('栖息地') && tab === 'habitats') {
                t.classList.add('active');
            } else if (t.textContent.includes('观测记录') && tab === 'observations') {
                t.classList.add('active');
            }
        });
    }
    
    // 显示/隐藏对应内容
    if (tab === 'all') {
        document.getElementById('results-species').style.display = 'block';
        document.getElementById('results-habitats').style.display = 'block';
        document.getElementById('results-observations').style.display = 'block';
    } else if (tab === 'species') {
        document.getElementById('results-species').style.display = 'block';
        document.getElementById('results-habitats').style.display = 'none';
        document.getElementById('results-observations').style.display = 'none';
    } else if (tab === 'habitats') {
        document.getElementById('results-species').style.display = 'none';
        document.getElementById('results-habitats').style.display = 'block';
        document.getElementById('results-observations').style.display = 'none';
    } else if (tab === 'observations') {
        document.getElementById('results-species').style.display = 'none';
        document.getElementById('results-habitats').style.display = 'none';
        document.getElementById('results-observations').style.display = 'block';
    }
}

// 高亮关键词
function highlightKeyword(text, keyword) {
    if (!text || !keyword) return text;
    const regex = new RegExp(`(${keyword})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
}

// 截断文本
function truncate(text, length) {
    if (!text) return '';
    return text.length > length ? text.substring(0, length) + '...' : text;
}
</script>

<style>

    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

    text-align: center;
    margin-bottom: 40px;
}

    margin-bottom: 30px;
}

    display: flex;
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
}

    flex: 1;
    padding: 15px 20px;

    border: 2px solid #ddd;
    border-radius: 8px;
}

    padding: 15px;
    border: 2px solid #ddd;

}

    text-align: center;
    margin-bottom: 40px;
}

    flex-wrap: wrap;
    justify-content: center;

}

.tag {

    color: white;
}

    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

}

    margin-bottom: 30px;

}
