{% extends "base.html" %}

{% block title %}栖息地管理{% endblock %}

{% block content %}
<div class="page-header">
    <h2>栖息地管理</h2>
    <button class="btn btn-primary" onclick="showAddModal()">+ 添加栖息地</button>
</div>

<!-- 栖息地列表 -->
<div class="species-grid" id="habitats-list">
    <!-- 动态加载 -->
</div>

<!-- 添加栖息地模态框 -->
<div id="add-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAddModal()">&times;</span>
        <h3>添加新栖息地</h3>
        
        <form id="add-habitat-form" onsubmit="addHabitat(event)">
            <div class="form-group">
                <label>栖息地名称 *</label>
                <input type="text" name="name" required placeholder="例如: 长白山自然保护区">
            </div>

            <div class="form-group">
                <label>环境描述</label>
                <textarea name="environment" rows="3" placeholder="描述栖息地的环境特征..."></textarea>
            </div>

            <div class="form-group">
                <label>保护等级 *</label>
                <select name="protection_level" required>
                    <option value="">请选择</option>
                    <option value="国家级">国家级</option>
                    <option value="省级">省级</option>
                    <option value="市级">市级</option>
                </select>
            </div>

            <div class="form-group">
                <label>纬度</label>
                <input type="number" name="latitude" step="any" placeholder="例如: 42.0">
            </div>

            <div class="form-group">
                <label>经度</label>
                <input type="number" name="longitude" step="any" placeholder="例如: 128.0">
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script>
let allHabitats = [];

// 加载栖息地列表
async function loadHabitats() {
    try {
        const response = await fetch('/api/habitats');
        allHabitats = await response.json();
        displayHabitats(allHabitats);
    } catch (error) {
        console.error('加载失败:', error);
        alert('加载栖息地数据失败');
    }
}

// 显示栖息地
function displayHabitats(habitats) {
    const container = document.getElementById('habitats-list');
    
    if (habitats.length === 0) {
        container.innerHTML = '<p class="no-data">暂无数据</p>';
        return;
    }
    
    container.innerHTML = habitats.map(h => `
        <div class="species-card">
            <div class="species-icon">🌲</div>
            <h4>${h.name || '未命名'}</h4>
            ${h.protection_level ? `<p class="category"><span class="badge badge-danger">${h.protection_level}</span></p>` : ''}
            ${h.environment ? `<p class="habitat">📍 ${h.environment}</p>` : ''}
            ${h.location && (h.location.latitude || h.location.longitude) ? 
                `<p class="diet">🗺️ 坐标: ${h.location.latitude || 'N/A'}, ${h.location.longitude || 'N/A'}</p>` : ''}
            <div class="card-actions">
                <button onclick="deleteHabitat('${h._id}')" class="btn-small btn-danger">删除</button>
            </div>
        </div>
    `).join('');
}

// 显示添加模态框
function showAddModal() {
    document.getElementById('add-modal').style.display = 'block';
}

// 关闭添加模态框
function closeAddModal() {
    document.getElementById('add-modal').style.display = 'none';
    document.getElementById('add-habitat-form').reset();
}

// 添加栖息地
async function addHabitat(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const data = {
        name: formData.get('name'),
        environment: formData.get('environment') || '',
        protection_level: formData.get('protection_level') || '',
        location: {
            latitude: formData.get('latitude') ? parseFloat(formData.get('latitude')) : null,
            longitude: formData.get('longitude') ? parseFloat(formData.get('longitude')) : null
        }
    };
    
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
        alert('请先登录');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch('/api/habitats', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Session-Token': sessionToken
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('添加成功！');
            closeAddModal();
            loadHabitats();
        }
    } catch (error) {
        console.error('添加失败:', error);
        alert('添加失败，请重试');
    }
}

// 删除栖息地
async function deleteHabitat(id) {
    if (!confirm('确定要删除这个栖息地吗？')) return;
    
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
        alert('请先登录');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch(`/api/habitats/${id}`, {
            method: 'DELETE',
            headers: {
                'X-Session-Token': sessionToken
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('删除成功');
            loadHabitats();
        }
    } catch (error) {
        console.error('删除失败:', error);
        alert('删除失败');
    }
}

// 页面加载时
loadHabitats();

// 点击模态框外部关闭
window.onclick = function(event) {
    const addModal = document.getElementById('add-modal');
    
    if (event.target == addModal) {
        closeAddModal();
    }
}
</script>
{% endblock %}
