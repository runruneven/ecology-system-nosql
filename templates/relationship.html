{% extends "base.html" %}

{% block title %}生态关系管理{% endblock %}

{% block content %}
<div class="page-header">
    <h2>生态关系管理</h2>
    <button class="btn btn-primary" onclick="showAddRelModal()">+ 创建关系</button>
</div>

<!-- 关系类型筛选 -->
<div class="filters">
    <select id="rel-type-filter" onchange="filterRelationships()">
        <option value="">全部关系</option>
        <option value="PREYS_ON">捕食关系</option>
        <option value="COMPETES_WITH">竞争关系</option>
        <option value="SYMBIOSIS">共生关系</option>
        <option value="PARASITISM">寄生关系</option>
    </select>
</div>

<!-- 关系列表 -->
<div class="relationship-list" id="relationship-list">
    <!-- 动态加载 -->
</div>

<!-- 添加关系模态框 -->
<div id="add-rel-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAddRelModal()">&times;</span>
        <h3>创建生态关系</h3>
        
        <form id="add-rel-form" onsubmit="addRelationship(event)">
            <div class="form-group">
                <label>物种 A（主体） *</label>
                <select name="species1_id" id="species1-select" required>
                    <option value="">请选择物种</option>
                </select>
            </div>

            <div class="form-group">
                <label>关系类型 *</label>
                <select name="type" required>
                    <option value="PREYS_ON">捕食 (A 捕食 B)</option>
                    <option value="COMPETES_WITH">竞争 (A 与 B 竞争)</option>
                    <option value="SYMBIOSIS">共生 (A 与 B 共生)</option>
                    <option value="PARASITISM">寄生 (A 寄生于 B)</option>
                </select>
            </div>

            <div class="form-group">
                <label>物种 B（客体） *</label>
                <select name="species2_id" id="species2-select" required>
                    <option value="">请选择物种</option>
                </select>
            </div>

            <div class="form-group">
                <label>关系描述</label>
                <textarea name="description" rows="2" placeholder="描述这种生态关系..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeAddRelModal()">取消</button>
                <button type="submit" class="btn btn-primary">创建</button>
            </div>
        </form>
    </div>
</div>

<!-- ⭐ 编辑关系模态框（新增）-->
<div id="edit-rel-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditRelModal()">&times;</span>
        <h3>编辑生态关系</h3>
        
        <form id="edit-rel-form" onsubmit="updateRelationship(event)">
            <input type="hidden" id="edit-rel-id" name="relationship_id">
            
            <div class="form-group">
                <label>物种 A（主体） *</label>
                <select id="edit-species1" name="species1_id" required>
                    <option value="">请选择物种</option>
                </select>
            </div>

            <div class="form-group">
                <label>关系类型 *</label>
                <select id="edit-type" name="type" required>
                    <option value="PREYS_ON">捕食 (A 捕食 B)</option>
                    <option value="COMPETES_WITH">竞争 (A 与 B 竞争)</option>
                    <option value="SYMBIOSIS">共生 (A 与 B 共生)</option>
                    <option value="PARASITISM">寄生 (A 寄生于 B)</option>
                </select>
            </div>

            <div class="form-group">
                <label>物种 B（客体） *</label>
                <select id="edit-species2" name="species2_id" required>
                    <option value="">请选择物种</option>
                </select>
            </div>

            <div class="form-group">
                <label>关系描述</label>
                <textarea id="edit-description" name="description" rows="2"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeEditRelModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存更新</button>
            </div>
        </form>
    </div>
</div>

<script>
let allRelationships = [];
let allSpecies = [];

// 加载物种列表（用于下拉选择）
async function loadSpeciesForSelect() {
    try {
        const response = await fetch('/api/species');
        allSpecies = await response.json();
        
        const select1 = document.getElementById('species1-select');
        const select2 = document.getElementById('species2-select');
        const editSelect1 = document.getElementById('edit-species1');
        const editSelect2 = document.getElementById('edit-species2');
        
        const options = allSpecies.map(s => 
            `<option value="${s._id}">${s.name} (${s.category})</option>`
        ).join('');
        
        select1.innerHTML = '<option value="">请选择物种</option>' + options;
        select2.innerHTML = '<option value="">请选择物种</option>' + options;
        editSelect1.innerHTML = '<option value="">请选择物种</option>' + options;
        editSelect2.innerHTML = '<option value="">请选择物种</option>' + options;
    } catch (error) {
        console.error('加载物种失败:', error);
    }
}

// 加载关系列表
async function loadRelationships() {
    try {
        const response = await fetch('/api/relationships');
        allRelationships = await response.json();
        displayRelationships(allRelationships);
    } catch (error) {
        console.error('加载失败:', error);
    }
}

// 显示关系
function displayRelationships(relationships) {
    const container = document.getElementById('relationship-list');
    
    if (relationships.length === 0) {
        container.innerHTML = '<p class="no-data">暂无生态关系数据</p>';
        return;
    }
    
    container.innerHTML = relationships.map(r => `
        <div class="relationship-item">
            <div class="rel-arrow">
                <span class="species-name">${getSpeciesName(r.species1_id)}</span>
                <span class="arrow">${getRelationArrow(r.type)}</span>
                <span class="species-name">${getSpeciesName(r.species2_id)}</span>
            </div>
            <p class="rel-type">${getRelationText(r.type)}</p>
            ${r.description ? `<p class="rel-desc">${r.description}</p>` : ''}
            <div class="card-actions">
                <button onclick="editRelationship('${r._id}')" class="btn-small btn-warning">编辑</button>
                <button onclick="deleteRelationship('${r._id}')" class="btn-small btn-danger">删除</button>
            </div>
        </div>
    `).join('');
}

function getSpeciesName(id) {
    const species = allSpecies.find(s => s._id === id);
    return species ? species.name : '未知物种';
}

function getRelationText(type) {
    const texts = {
        'PREYS_ON': '捕食关系',
        'COMPETES_WITH': '竞争关系',
        'SYMBIOSIS': '共生关系',
        'PARASITISM': '寄生关系'
    };
    return texts[type] || type;
}

function getRelationArrow(type) {
    return type === 'SYMBIOSIS' ? '↔️' : '→';
}

function filterRelationships() {
    const type = document.getElementById('rel-type-filter').value;
    const filtered = type ? 
        allRelationships.filter(r => r.type === type) : 
        allRelationships;
    displayRelationships(filtered);
}

function showAddRelModal() {
    loadSpeciesForSelect();
    document.getElementById('add-rel-modal').style.display = 'block';
}

function closeAddRelModal() {
    document.getElementById('add-rel-modal').style.display = 'none';
    document.getElementById('add-rel-form').reset();
}

async function addRelationship(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
        alert('请先登录');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch('/api/relationship', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Session-Token': sessionToken
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('创建成功！');
            closeAddRelModal();
            loadRelationships();
        }
    } catch (error) {
        console.error('创建失败:', error);
        alert('创建失败');
    }
}

// ⭐ 编辑关系（新增功能）
async function editRelationship(id) {
    try {
        // 1. 获取关系详情
        const response = await fetch(`/api/relationship/${id}`);
        const relationship = await response.json();
        
        if (!relationship || relationship.error) {
            alert('获取关系信息失败');
            return;
        }
        
        // 2. 加载物种列表
        await loadSpeciesForSelect();
        
        // 3. 填充表单
        document.getElementById('edit-rel-id').value = id;
        document.getElementById('edit-species1').value = relationship.species1_id || '';
        document.getElementById('edit-species2').value = relationship.species2_id || '';
        document.getElementById('edit-type').value = relationship.type || '';
        document.getElementById('edit-description').value = relationship.description || '';
        
        // 4. 显示模态框
        document.getElementById('edit-rel-modal').style.display = 'block';
        
    } catch (error) {
        console.error('加载关系信息失败:', error);
        alert('加载失败，请重试');
    }
}

function closeEditRelModal() {
    document.getElementById('edit-rel-modal').style.display = 'none';
    document.getElementById('edit-rel-form').reset();
}

// ⭐ 更新关系（新增功能）
async function updateRelationship(event) {
    event.preventDefault();
    
    const relationshipId = document.getElementById('edit-rel-id').value;
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    
    // 移除 relationship_id（不需要提交这个字段）
    delete data.relationship_id;
    
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
        alert('请先登录');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch(`/api/relationship/${relationshipId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Session-Token': sessionToken
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('更新成功！');
            closeEditRelModal();
            loadRelationships();  // 刷新列表
        } else {
            alert('更新失败: ' + (result.message || '未知错误'));
        }
    } catch (error) {
        console.error('更新失败:', error);
        alert('更新失败，请重试');
    }
}

async function deleteRelationship(id) {
    if (!confirm('确定删除此关系吗？')) return;
    
    const sessionToken = localStorage.getItem('session_token');
    if (!sessionToken) {
        alert('请先登录');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch(`/api/relationship/${id}`, {
            method: 'DELETE',
            headers: {
                'X-Session-Token': sessionToken
            }
        });
        
        if (response.ok) {
            alert('删除成功');
            loadRelationships();
        }
    } catch (error) {
        console.error('删除失败:', error);
    }
}

// 页面加载时
loadSpeciesForSelect();
loadRelationships();

// 点击模态框外部关闭
window.onclick = function(event) {
    const addModal = document.getElementById('add-rel-modal');
    const editModal = document.getElementById('edit-rel-modal');
    
    if (event.target == addModal) {
        closeAddRelModal();
    }
    if (event.target == editModal) {
        closeEditRelModal();
    }
}
</script>

<style>
.btn-warning {
    background-color: #ff9800;
    color: white;
}

.btn-warning:hover {
    background-color: #f57c00;
}
</style>
{% endblock %}
